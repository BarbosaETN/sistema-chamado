name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MYSQLDATABASE: sistema_chamados_test
      MYSQLUSER: teste
      MYSQLPASSWORD: teste
      MYSQLHOST: localhost
      MYSQLPORT: 3307
      JWT_SECRET: Estev@nfcteste
      JWT_EXPIRES_IN: 1h

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_DATABASE: sistema_chamados_test
          MYSQL_USER: teste
          MYSQL_PASSWORD: teste
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar conexão com Sequelize
        run: |
          node --input-type=module -e "import sequelize from './src/config/database.js'; await sequelize.authenticate(); console.log('Sequelize conectado ao MySQL'); await sequelize.close();"  

      - name: Executar migrations
        run: npx sequelize-cli db:migrate
          
      - name: Executar testes
        run: npm test -- --runInBand