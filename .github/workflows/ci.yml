name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MYSQLDATABASE: sistema_chamados_test
      MYSQLUSER: teste
      MYSQLPASSWORD: teste
      MYSQLHOST: localhost
      MYSQLPORT: 3307
      JWT_SECRET: Estev@nfcteste
      JWT_EXPIRES_IN: 1h

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_DATABASE: sistema_chamados_test
          MYSQL_USER: teste
          MYSQL_PASSWORD: teste
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verificar MySQL
        run: |
          mysqladmin ping -h 127.0.0.1 -P 3307 -u teste -pteste

      - name: Verificar variáveis
        run: |
          node -e "console.log('HOST:', process.env.MYSQLHOST)"
          node -e "console.log('PORT:', process.env.MYSQLPORT)"
          node -e "console.log('DATABASE:', process.env.MYSQLDATABASE)"
          node -e "console.log('USER:', process.env.MYSQLUSER)"    

      - name: Instalar dependências
        run: npm ci